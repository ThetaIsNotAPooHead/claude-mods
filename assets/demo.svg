<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 500" width="860" height="500">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1a1033"/><stop offset="1" stop-color="#0b1a2e"/></linearGradient>
  <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000" flood-opacity="0.55"/></filter>
  <filter id="glow" x="-20%" y="-60%" width="140%" height="220%"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <clipPath id="t1"><rect x="60" y="420" height="26" width="0">
<animate attributeName="width" dur="16s" repeatCount="indefinite" values="0;0;110;110;0;0" keyTimes="0;0.0625;0.1375;0.1812;0.1819;1"/></rect></clipPath>
  <clipPath id="t2"><rect x="60" y="420" height="26" width="0">
<animate attributeName="width" dur="16s" repeatCount="indefinite" values="0;0;330;330;0;0" keyTimes="0;0.4625;0.5125;0.5250;0.5256;1"/></rect></clipPath>
</defs>

<rect width="860" height="500" fill="url(#bg)"/>

<!-- window -->
<g filter="url(#shadow)">
  <rect x="30" y="30" width="800" height="440" rx="14" fill="#0d1117" stroke="#30363d"/>
</g>
<rect x="30" y="30" width="800" height="40" rx="14" fill="#161b22"/>
<rect x="30" y="56" width="800" height="14" fill="#161b22"/>
<circle cx="56" cy="50" r="6" fill="#ff5f57"/><circle cx="76" cy="50" r="6" fill="#febc2e"/><circle cx="96" cy="50" r="6" fill="#28c840"/>
<text x="430" y="55" text-anchor="middle" fill="#8b949e" font-size="14" font-family="-apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif">claude-mods demo</text>

<!-- scene 1 label -->
<text x="60" y="110" fill="#8b949e" font-size="14" font-family="-apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" opacity="0">How many tokens have I ever used?<animate attributeName="opacity" dur="16s" repeatCount="indefinite" calcMode="linear" values="0;0;1;1;0;0" keyTimes="0;0.0250;0.0406;0.4500;0.4656;1"/></text>
<text x="60" y="150" fill="#ffd166" font-size="17" font-weight="600" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" opacity="0">🪙 LIFETIME TOKENS: 13.9B<animate attributeName="opacity" dur="16s" repeatCount="indefinite" calcMode="linear" values="0;0;1;1;0;0" keyTimes="0;0.1875;0.2031;0.4500;0.4656;1"/></text><text x="60" y="178" fill="#c9d1d9" font-size="17" font-weight="400" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" opacity="0">  Cache reads     13.7B   98.2%<animate attributeName="opacity" dur="16s" repeatCount="indefinite" calcMode="linear" values="0;0;1;1;0;0" keyTimes="0;0.2094;0.2250;0.4500;0.4656;1"/></text><text x="60" y="206" fill="#c9d1d9" font-size="17" font-weight="400" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" opacity="0">  Cache writes     213M    1.5%<animate attributeName="opacity" dur="16s" repeatCount="indefinite" calcMode="linear" values="0;0;1;1;0;0" keyTimes="0;0.2313;0.2469;0.4500;0.4656;1"/></text><text x="60" y="234" fill="#c9d1d9" font-size="17" font-weight="400" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" opacity="0">  Output          37.5M    0.3%<animate attributeName="opacity" dur="16s" repeatCount="indefinite" calcMode="linear" values="0;0;1;1;0;0" keyTimes="0;0.2531;0.2687;0.4500;0.4656;1"/></text><text x="60" y="262" fill="#8b949e" font-size="17" font-weight="400" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" opacity="0">  By model:  opus-5-5 10.0B · opus-4-8 2.27B<animate attributeName="opacity" dur="16s" repeatCount="indefinite" calcMode="linear" values="0;0;1;1;0;0" keyTimes="0;0.2750;0.2906;0.4500;0.4656;1"/></text>

<!-- scene 2: a question and a long answer -->
<g opacity="0"><animate attributeName="opacity" dur="16s" repeatCount="indefinite" calcMode="linear" values="0;0;1;1;0;0" keyTimes="0;0.5188;0.5344;0.9500;0.9656;1"/>
  <rect x="60" y="96" width="330" height="40" rx="10" fill="#1f6feb" opacity="0.25"/>
  <text x="76" y="122" fill="#c9d1d9" font-size="16" font-family="-apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif">make my shop system exploit-proof</text>
</g>
<rect x="60" y="170" width="520" height="10" rx="5" fill="#30363d" opacity="0"><animate attributeName="opacity" dur="16s" repeatCount="indefinite" calcMode="linear" values="0;0;1;1;0;0" keyTimes="0;0.5375;0.5531;0.9500;0.9656;1"/></rect><rect x="60" y="194" width="610" height="10" rx="5" fill="#30363d" opacity="0"><animate attributeName="opacity" dur="16s" repeatCount="indefinite" calcMode="linear" values="0;0;1;1;0;0" keyTimes="0;0.5531;0.5687;0.9500;0.9656;1"/></rect><rect x="60" y="218" width="470" height="10" rx="5" fill="#30363d" opacity="0"><animate attributeName="opacity" dur="16s" repeatCount="indefinite" calcMode="linear" values="0;0;1;1;0;0" keyTimes="0;0.5687;0.5844;0.9500;0.9656;1"/></rect><rect x="60" y="242" width="580" height="10" rx="5" fill="#30363d" opacity="0"><animate attributeName="opacity" dur="16s" repeatCount="indefinite" calcMode="linear" values="0;0;1;1;0;0" keyTimes="0;0.5844;0.6000;0.9500;0.9656;1"/></rect><rect x="60" y="266" width="300" height="10" rx="5" fill="#30363d" opacity="0"><animate attributeName="opacity" dur="16s" repeatCount="indefinite" calcMode="linear" values="0;0;1;1;0;0" keyTimes="0;0.6000;0.6156;0.9500;0.9656;1"/></rect>
<g opacity="0"><animate attributeName="opacity" dur="16s" repeatCount="indefinite" calcMode="linear" values="0;0;1;1;0;0" keyTimes="0;0.6438;0.6656;0.9500;0.9719;1"/>
  <rect x="52" y="300" width="720" height="44" rx="10" fill="#2a2210" stroke="#ffd166" stroke-opacity="0.6"/>
  <text x="70" y="328" fill="#ffd166" font-size="17" font-weight="600" font-family="-apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" filter="url(#glow)">💡 TL;DR: The shop now checks every purchase on the server, so cheaters can't fake buys.</text>
</g>

<!-- prompt box -->
<rect x="48" y="412" width="764" height="40" rx="10" fill="#161b22" stroke="#30363d"/>
<text x="60" y="438" fill="#e6edf3" font-size="17" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" clip-path="url(#t1)">/tokens</text>
<text x="60" y="438" fill="#e6edf3" font-size="17" font-family="-apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" clip-path="url(#t2)">make my shop system exploit-proof</text>
<rect x="60" y="423" width="2" height="20" fill="#e6edf3"><animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite"/></rect>

<!-- footer chips -->
<g font-family="-apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="13">
  <rect x="48" y="456" width="196" height="22" rx="11" fill="#2a2210"/>
  <text x="60" y="471" fill="#ffd166">🪙 13.9B lifetime tokens</text>
  <rect x="252" y="456" width="196" height="22" rx="11" fill="#10261a"/>
  <text x="264" y="471" fill="#7ee787" opacity="1">🟢 5h 35% · resets 3h 26m<animate attributeName="opacity" dur="16s" repeatCount="indefinite" values="1;1;0;0;1" keyTimes="0;0.70;0.72;0.98;1"/></text>
  <text x="264" y="471" fill="#7ee787" opacity="0">🟢 5h 41% · resets 3h 12m<animate attributeName="opacity" dur="16s" repeatCount="indefinite" values="0;0;1;1;0" keyTimes="0;0.70;0.72;0.98;1"/></text>
  <rect x="456" y="456" width="200" height="22" rx="11" fill="#2a2410"/>
  <text x="468" y="471" fill="#e3b341">🟡 week 85% · resets 3d 15h</text>
</g>
</svg>